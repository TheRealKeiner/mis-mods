name: Compilar Death Sound Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Crear proyecto del mod y agregar sonido
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/java/com/keiner/deathsound
          mkdir -p src/main/resources/assets/deathsound/sounds

          cat > death_audio.b64 <<'AUDIO_BASE64'
          
